version: "3.9"

services:

  #Churn Prediction API + Gradio UI
  churn-api:
    build:
      context: ..           # Build from project root (so COPY paths work)
      dockerfile: docker/Dockerfile
    container_name: churn-predictor
    ports:
      - "8000:8000"         # FastAPI : http://localhost:8000
                            # Gradio  : http://localhost:8000/ui
                            # API docs: http://localhost:8000/docs
    volumes:
      - ../artifacts:/app/artifacts   # Mount artifacts so model updates don't need rebuild
      - ../mlruns:/app/mlruns         # Mount MLflow runs for experiment tracking
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  #MLflow Tracking Server
  mlflow:
    image: python:3.9-slim
    container_name: mlflow-server
    working_dir: /mlruns
    volumes:
      - ../mlruns:/mlruns
    ports:
      - "5000:5000"         # MLflow UI: http://localhost:5000
    command: >
      bash -c "pip install mlflow --quiet &&
               mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns"
    restart: unless-stopped
